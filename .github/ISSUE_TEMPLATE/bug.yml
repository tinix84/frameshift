name: Bug
description: Report reproducible incorrect behavior
title: "[P1] "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and invariant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or redacted data. Never include secrets or private engineering data.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime, adapter, and contract versions
  - type: textarea
    id: impact
    attributes:
      label: Safety, privacy, or data-loss impact
