name: validate

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    # ADR-0004 promises one digest everywhere. A single runner cannot show that,
    # so the reference checkpoint is hashed on all three supported platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
      - run: python scripts/test_validate_repo.py
      - run: python evals/run.py
      - run: python -m unittest discover -s evals -p "test_*.py" -t .
      - run: python -m unittest discover -s frameshift -p "test_*.py" -t .
